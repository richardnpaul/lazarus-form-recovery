<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lazarus Form Recovery — Side Panel</title>
    <link rel="stylesheet" href="./sidepanel.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="sidepanel-header">
      <div class="brand">
        <div class="logo">L</div>
        <div class="title">Lazarus Control Center</div>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>Active</span>
      </div>
    </header>

    <!-- Active Site Banner -->
    <section class="site-banner" id="site-banner">
      <div class="site-info">
        <span class="site-dot" id="site-beacon"></span>
        <div class="site-details">
          <span class="site-domain" id="site-domain">Checking current tab...</span>
          <span class="site-status" id="site-status">Detecting...</span>
        </div>
      </div>
      <label class="switch" title="Toggle Lazarus tracking on this domain">
        <input type="checkbox" id="domain-toggle" checked />
        <span class="slider"></span>
      </label>
    </section>

    <!-- Diff Viewer Modal Card (shown when user clicks "Diff") -->
    <section class="diff-viewer" id="diff-viewer">
      <div class="diff-header">
        <span class="diff-title" id="diff-title">Revision Diff Viewer</span>
        <button class="action-btn" id="close-diff-btn">Close ✕</button>
      </div>
      <div class="diff-body" id="diff-content"></div>
    </section>

    <!-- Search Filter -->
    <div class="search-container">
      <input
        type="search"
        id="search-input"
        class="search-input"
        placeholder="Search captured form history..."
      />
    </div>

    <!-- Filter Chips -->
    <div class="filter-chips">
      <button class="filter-chip is-active" data-filter="this_site" id="chip-this-site">
        This Site
      </button>
      <button class="filter-chip" data-filter="all">All Sites</button>
      <button class="filter-chip" data-filter="today">Today</button>
      <button class="filter-chip" data-filter="7days">Last 7 Days</button>
      <button class="filter-chip" data-filter="30days">Last 30 Days</button>
    </div>

    <!-- History Feed Header -->
    <div class="history-header">
      <span style="font-weight: 600; font-size: 12px">Saved Drafts</span>
      <span id="history-count" class="history-count">Loading...</span>
    </div>

    <!-- History List -->
    <main id="history-list" class="history-list"></main>

    <!-- Footer -->
    <footer class="sidepanel-footer">
      <a id="clear-history-btn">🗑️ Clear All</a>
      <a id="open-options-btn">⚙️ Settings</a>
    </footer>

    <script type="module" src="./sidepanel.ts"></script>
  </body>
</html>
