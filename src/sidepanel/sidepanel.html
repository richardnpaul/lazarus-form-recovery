<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="sidepanelHeaderTitle">Lazarus Form Recovery — Side Panel</title>
    <link rel="stylesheet" href="./sidepanel.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="sidepanel-header">
      <div class="brand">
        <div class="logo">L</div>
        <div class="title" data-i18n="sidepanelHeaderTitle">Lazarus Control Center</div>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span data-i18n="sidepanelStatusActive">Active</span>
      </div>
    </header>

    <!-- Active Site Banner -->
    <section class="site-banner" id="site-banner">
      <div class="site-info">
        <span class="site-dot" id="site-beacon"></span>
        <div class="site-details">
          <span class="site-domain" id="site-domain" data-i18n="sidepanelCheckingTab"
            >Checking current tab...</span
          >
          <span class="site-status" id="site-status" data-i18n="sidepanelDetecting"
            >Detecting...</span
          >
        </div>
      </div>
      <label
        class="switch"
        data-i18n-title="sidepanelToggleDomainTooltip"
        title="Toggle Lazarus tracking on this domain"
      >
        <input type="checkbox" id="domain-toggle" checked />
        <span class="slider"></span>
      </label>
    </section>

    <!-- Search Filter -->
    <div class="search-container">
      <input
        type="search"
        id="search-input"
        class="search-input"
        data-i18n-placeholder="sidepanelSearchPlaceholder"
        placeholder="Search captured form history..."
      />
    </div>

    <!-- Filter Chips -->
    <div class="filter-chips">
      <button
        class="filter-chip is-active"
        data-filter="all"
        id="chip-all-sites"
        data-i18n="sidepanelFilterAllSites"
      >
        All Sites
      </button>
      <button
        class="filter-chip"
        data-filter="this_site"
        id="chip-this-site"
        data-i18n="sidepanelFilterThisSite"
      >
        This Site
      </button>
      <button class="filter-chip" data-filter="today" data-i18n="sidepanelFilterToday">
        Today
      </button>
      <button class="filter-chip" data-filter="7days" data-i18n="sidepanelFilter7Days">
        Last 7 Days
      </button>
      <button class="filter-chip" data-filter="30days" data-i18n="sidepanelFilter30Days">
        Last 30 Days
      </button>
    </div>

    <!-- Vault Unlock Card -->
    <section class="vault-unlock-card" id="vault-unlock-container" style="display: none">
      <div class="vault-unlock-header">
        <span class="vault-lock-icon">🔒</span>
        <div class="vault-unlock-text">
          <div class="vault-unlock-title" data-i18n="sidepanelVaultLockedTitle">Vault Locked</div>
          <div class="vault-unlock-desc" data-i18n="sidepanelVaultLockedDesc">
            Enter master password to unlock form history.
          </div>
        </div>
      </div>
      <form id="vault-unlock-form" class="vault-unlock-form">
        <input
          type="password"
          id="vault-password-input"
          class="vault-password-input"
          data-i18n-placeholder="sidepanelVaultPasswordPlaceholder"
          placeholder="Master Password"
          autocomplete="current-password"
        />
        <button
          type="submit"
          id="btn-unlock-vault"
          class="btn-unlock"
          data-i18n="sidepanelBtnUnlock"
        >
          Unlock
        </button>
      </form>
      <div id="vault-unlock-error" class="vault-unlock-error" style="display: none"></div>
    </section>

    <!-- History Feed Header -->
    <div class="history-header">
      <span style="font-weight: 600; font-size: 12px" data-i18n="sidepanelSavedDrafts"
        >Saved Drafts</span
      >
      <span id="history-count" class="history-count" data-i18n="sidepanelLoading">Loading...</span>
    </div>

    <!-- History List -->
    <main id="history-list" class="history-list"></main>

    <!-- Footer -->
    <footer class="sidepanel-footer">
      <a id="lock-vault-btn" style="display: none" data-i18n="sidepanelFooterLockVault"
        >🔒 Lock Vault</a
      >
      <a id="clear-history-btn" data-i18n="sidepanelFooterClearAll">🗑️ Clear All</a>
      <a id="open-options-btn" data-i18n="sidepanelFooterSettings">⚙️ Settings</a>
    </footer>

    <script type="module" src="./sidepanel.ts"></script>
  </body>
</html>
